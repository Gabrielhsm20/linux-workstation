---
- name: Check the installed ChatGPT Community package
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Status}', codex-desktop]
  register: chatgpt_community_package
  changed_when: false
  failed_when: false
  become: false

- name: Install ChatGPT Community when the package is absent or incomplete
  ansible.builtin.include_tasks: install.yml
  when: chatgpt_community_package.stdout | trim != 'install ok installed'

- name: Update an existing ChatGPT Community installation when requested
  ansible.builtin.include_tasks: update.yml
  when:
    - chatgpt_community_package.stdout | trim == 'install ok installed'
    - "'chatgpt_community_update' in ansible_run_tags"

- name: Verify the installed package and executable
  ansible.builtin.shell: |
    set -euo pipefail
    test "$(dpkg-query -W -f='${Status}' codex-desktop)" = 'install ok installed'
    dpkg-query -W codex-desktop
    command -v codex-desktop
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/bin:{{ ansible_env.PATH }}"
  changed_when: false
  become: false

- name: Report the installed application
  ansible.builtin.debug:
    msg: 'ChatGPT Community is installed. Start it manually from the Cinnamon menu.'
